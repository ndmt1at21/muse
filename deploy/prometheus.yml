# Prometheus scrape config for the Muse stack (Phase 11). Each service exposes
# /metrics: Core on its health port, the BFFs on their HTTP port. Alert rules
# live in alerts.yml (loaded below).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: core
    static_configs:
      - targets: ["core:9091"] # HEALTH_ADDR :9091
        labels: { service: core }

  - job_name: bff-consumer
    static_configs:
      - targets: ["bff-consumer:8080"]
        labels: { service: bff-consumer }

  - job_name: bff-admin
    static_configs:
      - targets: ["bff-admin:8081"]
        labels: { service: bff-admin }
