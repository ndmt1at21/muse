# Vertical-slice stack: Postgres + MySQL + Dragonfly (Redis-compatible) + Core
# + the two reference BFFs from examples/. Core is the product surface and now
# serves REST (grpc-gateway) on :8090 in addition to gRPC on :9090, so it is
# usable directly; the BFFs are shipped as a runnable reference for the edge
# layer a developer builds on top of Core.
#
# Switch Core to MySQL by setting DB_ENGINE=mysql and DB_DSN to the mysql_dsn
# below (or run `make up-mysql`). The full LGTM observability stack
# (otel-collector + grafana + prometheus + tempo + loki) is added in the
# observability finishing phase; the services already expose /metrics + trace_id.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse
      POSTGRES_DB: muse
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muse"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: muse
      MYSQL_PASSWORD: muse
      MYSQL_DATABASE: muse
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmuse"]
      interval: 3s
      timeout: 3s
      retries: 20

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ulimits:
      memlock: -1
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: core/cmd/core
    environment:
      CORE_GRPC_ADDR: ":9090"
      CORE_REST_ADDR: ":8090"
      CORE_HEALTH_ADDR: ":9091"
      DB_ENGINE: postgres
      DB_DSN: "postgres://muse:muse@postgres:5432/muse?sslmode=disable"
      REDIS_ADDR: "dragonfly:6379"
      LOG_LEVEL: info
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret}"
      AUTH_DEV_MODE: "${AUTH_DEV_MODE:-true}"
      FULFILLMENT_CALLBACK_BASE: "http://bff-admin:8081"
    ports: ["9090:9090", "9091:9091", "8090:8090"]
    depends_on:
      postgres: { condition: service_healthy }
      dragonfly: { condition: service_healthy }

  # Reference consumer BFF (examples/) — a runnable example of the public edge:
  # JWT auth, rate limiting, read-model cache, view-model assembly over Core.
  bff-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: examples/bff-consumer/cmd/bff-consumer
    environment:
      BFF_CONSUMER_ADDR: ":8080"
      CORE_GRPC_ADDR: "core:9090"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret}"
      AUTH_DEV_MODE: "${AUTH_DEV_MODE:-true}"  # reveal dev OTP codes (local/e2e); auth lives in the BFF
      REDIS_ADDR: "dragonfly:6379"          # distributed rate limit + read-model cache
      PLAY_RATE_LIMIT: "${PLAY_RATE_LIMIT:-60}"
    ports: ["8080:8080"]
    depends_on:
      core: { condition: service_started }
      dragonfly: { condition: service_healthy }

  # Reference admin BFF (examples/) — a runnable example of the internal edge:
  # role-guarded management surface + the signed fulfillment callback.
  bff-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: examples/bff-admin/cmd/bff-admin
    environment:
      BFF_ADMIN_ADDR: ":8081"
      CORE_GRPC_ADDR: "core:9090"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret}"
      FULFILLMENT_CALLBACK_SECRET: "${FULFILLMENT_CALLBACK_SECRET:-}"
      REDIS_ADDR: "dragonfly:6379"          # shared cache namespace for invalidation
    ports: ["8081:8081"]
    depends_on:
      core: { condition: service_started }
      dragonfly: { condition: service_healthy }

  # --- Observability (Phase 11): Prometheus scrapes /metrics; Grafana renders ---
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9092:9090"]
    depends_on: [core, bff-consumer, bff-admin]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
