version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/muse/pkg/gen
plugins:
  - local: protoc-gen-go
    out: pkg/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg/gen
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: pkg/gen
    opt:
      - paths=source_relative
      - generate_unbound_methods=false
  # OpenAPI v2 (Swagger) spec for Core's REST surface, merged into a single file
  # at core/api/openapi.swagger.json. json_names_for_fields=false keeps the
  # snake_case field names the gateway actually emits (UseProtoNames).
  - local: protoc-gen-openapiv2
    out: core/api
    opt:
      - allow_merge=true
      - merge_file_name=openapi
      - json_names_for_fields=false
