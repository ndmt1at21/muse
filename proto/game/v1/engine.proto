syntax = "proto3";

// Package game.v1 is the Core service boundary — the central product surface.
// Core serves this contract over both gRPC and REST: the google.api.http
// annotations below drive a grpc-gateway that exposes every RPC as JSON/HTTP
// under /api/v1, wrapped in the uniform {code, message, trace_id, data}
// envelope. Core is auth-agnostic — it trusts the caller (a BFF the developer
// builds, see examples/) to authenticate and to pass the tenant/merchant
// isolation keys (tenant_id + merchant_id); it only validates and operates on
// the business object. Errors map to gRPC status codes (and to the envelope at
// the gateway). Versioned by package; a breaking change becomes game.v2.
package game.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

// All time fields (created_at, updated_at, start_date, expires_at, …) are int64
// unix timestamps in SECONDS. 0 means unset.
//
// Tenancy: every scoped request carries tenant_id (always) and merchant_id
// (the merchant isolation key) as flat top-level fields — never a nested object.

// --- Enums: closed-set fields. The zero (_UNSPECIFIED) value is the wire/JSON
// default and also represents "" / "not set" when mapped to the persistence
// layer (which continues to store the lowercase token, e.g. "active").
// Open-ended, registry-driven fields (game type, seed_generator, reward_handler,
// validator, prize/reward type, integration event types) stay plain strings. ---

// GameStatus is a game's lifecycle state.
enum GameStatus {
  GAME_STATUS_UNSPECIFIED = 0;
  GAME_STATUS_DRAFT = 1;
  GAME_STATUS_ACTIVE = 2;
  GAME_STATUS_PAUSED = 3;
  GAME_STATUS_ENDED = 4;
}

// WalletScope is the isolation level points/milestones are keyed by
// (UNSPECIFIED → campaign, the default).
enum WalletScope {
  WALLET_SCOPE_UNSPECIFIED = 0;
  WALLET_SCOPE_CAMPAIGN = 1;
  WALLET_SCOPE_MERCHANT = 2;
  WALLET_SCOPE_TENANT = 3;
}

// RewardStatus is the lifecycle of an awarded reward record.
enum RewardStatus {
  REWARD_STATUS_UNSPECIFIED = 0;
  REWARD_STATUS_WON = 1;
  REWARD_STATUS_CLAIMED = 2;
  REWARD_STATUS_FULFILLED = 3;
  REWARD_STATUS_REVOKED = 4;
}

// TaskStatus is the state of a fulfillment outbox task. ReportResult callbacks
// finalize a task to FULFILLED or FAILED.
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_PROCESSING = 2;
  TASK_STATUS_FULFILLED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_DEAD = 5;
}

// ContactType is the kind of a verified contact.
enum ContactType {
  CONTACT_TYPE_UNSPECIFIED = 0;
  CONTACT_TYPE_PHONE = 1;
  CONTACT_TYPE_EMAIL = 2;
}

// AuthMethod is the verification method used to start/complete a login.
enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  AUTH_METHOD_CODE = 1;
  AUTH_METHOD_OTP = 2;
  AUTH_METHOD_MAGIC_LINK = 3;
  AUTH_METHOD_SOCIAL = 4;
}

// CampaignStatus is a campaign's lifecycle state.
enum CampaignStatus {
  CAMPAIGN_STATUS_UNSPECIFIED = 0;
  CAMPAIGN_STATUS_DRAFT = 1;
  CAMPAIGN_STATUS_ACTIVE = 2;
  CAMPAIGN_STATUS_PAUSED = 3;
  CAMPAIGN_STATUS_ENDED = 4;
}

// QuestRewardType is the kind of reward a quest grants on completion.
enum QuestRewardType {
  QUEST_REWARD_TYPE_UNSPECIFIED = 0;
  QUEST_REWARD_TYPE_PLAY_TURN = 1;
}

// QuestType selects the quest verifier.
enum QuestType {
  QUEST_TYPE_UNSPECIFIED = 0;
  QUEST_TYPE_DAILY_CHECKIN = 1;
  QUEST_TYPE_SHARE_SOCIAL = 2;
  QUEST_TYPE_INVITE_FRIEND = 3;
  QUEST_TYPE_SCAN_QR = 4;
  QUEST_TYPE_VIEW_PAGE = 5;
  QUEST_TYPE_ANSWER_QUESTION = 6;
  QUEST_TYPE_EXTERNAL_EVENT = 7;
}

// QuestStatus is whether a quest is live.
enum QuestStatus {
  QUEST_STATUS_UNSPECIFIED = 0;
  QUEST_STATUS_ACTIVE = 1;
  QUEST_STATUS_INACTIVE = 2;
}

// LeaderboardMetric is the score a leaderboard ranks by.
enum LeaderboardMetric {
  LEADERBOARD_METRIC_UNSPECIFIED = 0;
  LEADERBOARD_METRIC_HIGH_SCORE = 1;
  LEADERBOARD_METRIC_TOTAL_SCORE = 2;
  LEADERBOARD_METRIC_TOTAL_WINS = 3;
  LEADERBOARD_METRIC_TOTAL_PLAYS = 4;
  LEADERBOARD_METRIC_QUEST_POINTS = 5;
  LEADERBOARD_METRIC_COLLECTION_COUNT = 6;
}

// LeaderboardStatus is a leaderboard's lifecycle state.
enum LeaderboardStatus {
  LEADERBOARD_STATUS_UNSPECIFIED = 0;
  LEADERBOARD_STATUS_ACTIVE = 1;
  LEADERBOARD_STATUS_FINALIZED = 2;
}

// EntryState is a ranked entry's standing.
enum EntryState {
  ENTRY_STATE_UNSPECIFIED = 0;
  ENTRY_STATE_ACTIVE = 1;
  ENTRY_STATE_FLAGGED = 2;
  ENTRY_STATE_DISQUALIFIED = 3;
}

// LedgerReason is why a wallet ledger entry was written.
enum LedgerReason {
  LEDGER_REASON_UNSPECIFIED = 0;
  LEDGER_REASON_PLAY = 1;
  LEDGER_REASON_REDEEM = 2;
  LEDGER_REASON_ADJUST = 3;
}

// MilestoneStatus is a milestone's progress state for a player.
enum MilestoneStatus {
  MILESTONE_STATUS_UNSPECIFIED = 0;
  MILESTONE_STATUS_LOCKED = 1;
  MILESTONE_STATUS_UNLOCKED = 2;
  MILESTONE_STATUS_GRANTED = 3;
}

// MilestoneMode is how a milestone set behaves.
enum MilestoneMode {
  MILESTONE_MODE_UNSPECIFIED = 0;
  MILESTONE_MODE_CUMULATIVE_UNLOCK = 1;
  MILESTONE_MODE_SPEND_EXCHANGE = 2;
}

// IntegrationType is the outbound adapter kind.
enum IntegrationType {
  INTEGRATION_TYPE_UNSPECIFIED = 0;
  INTEGRATION_TYPE_WEBHOOK = 1;
  INTEGRATION_TYPE_GSHEET = 2;
  INTEGRATION_TYPE_SMS = 3;
  INTEGRATION_TYPE_ZNS = 4;
  INTEGRATION_TYPE_CRM = 5;
  INTEGRATION_TYPE_N8N = 6;
}

// IntegrationStatus is whether an integration is firing.
enum IntegrationStatus {
  INTEGRATION_STATUS_UNSPECIFIED = 0;
  INTEGRATION_STATUS_ACTIVE = 1;
  INTEGRATION_STATUS_PAUSED = 2;
}

// Rules are engine-enforced gameplay constraints.
message Rules {
  // Lifetime play cap per player (0 = unlimited).
  int32 max_plays_per_user = 1;
  // Per-day play cap per player (0 = unlimited).
  int32 max_plays_per_day = 2;
  // Require an authenticated player to start a game.
  bool require_login = 3;
  // Unix seconds; plays before this are rejected (0 = no lower bound).
  int64 start_date = 4;
  // Unix seconds; plays after this are rejected (0 = no upper bound).
  int64 end_date = 5;
  // Gate plays on the player's quest-granted turn balance (keyed by campaign).
  bool use_turns = 6;
}

// Game is the config-driven game definition. handler_config is opaque JSON the
// engine never interprets (decoded only by the reward handler/seed). The `ui`
// block is likewise opaque to the engine: Core stores and returns it verbatim
// but never interprets it — the presentation layer (BFF/widget) decodes it to
// render per-game backgrounds, theme colors, and slot/item images. Keeping it
// opaque preserves the Core = business / BFF = presentation boundary.
message Game {
  // Stable unique identifier (server-assigned on create).
  string id = 1;
  // Tenant isolation key (required).
  string tenant_id = 2;
  // Merchant isolation key within the tenant.
  string merchant_id = 3;
  // Campaign this game belongs to.
  string campaign_id = 4;
  // Human-readable game name.
  string name = 5;
  // Registry-driven game type (e.g. "spin_wheel", "scratch_card").
  string type = 6;
  // Registry key selecting the seed generator.
  string seed_generator = 7;
  // Registry key selecting the reward handler.
  string reward_handler = 8;
  // Registry key selecting the play validator (anti-cheat).
  string validator = 9;
  // Lifecycle state.
  GameStatus status = 10;
  // Engine-enforced gameplay constraints.
  Rules rules = 11;
  // Raw JSON, decoded by the reward handler/seed; never interpreted by the engine.
  string handler_config = 12;
  // Raw JSON render config, opaque to Core (stored & returned verbatim, never
  // interpreted). Decoded by the BFF/widget for per-game background, theme, and
  // slot/item images. Field 18 (was reserved when this lived only in the BFF).
  string ui = 18;
  // Raw JSON, decoded by the validator (anti-cheat).
  string validator_config = 13;
  // Creation time (unix seconds).
  int64 created_at = 14;
  // Last update time (unix seconds).
  int64 updated_at = 15;
  // Wallet isolation level for points/milestones (UNSPECIFIED → campaign).
  WalletScope wallet_scope = 16;
  // Raw JSON milestone config (currency, mode, auto_grant, thresholds).
  string milestones = 17;
}

// Prize is an awardable item with finite stock.
message Prize {
  // Stable unique identifier (server-assigned on create).
  string id = 1;
  // Tenant isolation key (required).
  string tenant_id = 2;
  // Merchant isolation key within the tenant.
  string merchant_id = 3;
  // Human-readable prize name.
  string name = 4;
  // Registry-driven prize type (e.g. "voucher", "physical", "points").
  string type = 5;
  // Display image URL.
  string image = 6;
  // Nominal value (currency minor units or points), for display/tiering.
  int64 value = 7;
  // Total stock minted.
  int64 total = 8;
  // Stock still available to award.
  int64 remaining = 9;
  // Raw JSON, adapter/display-specific metadata.
  string metadata = 10;
  // Raw JSON award limits: {max_per_user, max_per_day}.
  string award_constraints = 11;
  // Raw JSON fulfillment policy: {redemption_mode, method}.
  string fulfillment = 12;
}

// RewardRecord is a durable record that a player won one unit of a prize.
message RewardRecord {
  // Stable unique identifier.
  string id = 1;
  // Tenant isolation key.
  string tenant_id = 2;
  // Merchant isolation key within the tenant.
  string merchant_id = 3;
  // Game the reward was won in.
  string game_id = 4;
  // Player who won the reward.
  string player_id = 5;
  // Prize that was awarded.
  string prize_id = 6;
  // Play that produced the reward.
  string play_id = 7;
  // Prize name snapshot at award time.
  string name = 8;
  // Prize type snapshot at award time.
  string type = 9;
  // Prize value snapshot at award time.
  int64 value = 10;
  // Assigned voucher/redemption code, if any.
  string code = 11;
  // Reward lifecycle state.
  RewardStatus status = 12;
  // Won time (unix seconds).
  int64 created_at = 13;
  // Claimed time (unix seconds; 0 if unclaimed).
  int64 claimed_at = 14;
  // Fulfilled time (unix seconds; 0 if unfulfilled).
  int64 fulfilled_at = 15;
  // Revoked time (unix seconds; 0 if not revoked).
  int64 revoked_at = 16;
}

// Reward is a single awarded item in a play result.
message Reward {
  // Prize that was awarded.
  string prize_id = 1;
  // Prize name for display.
  string name = 2;
  // Prize image URL for display.
  string image = 3;
  // Prize type.
  string type = 4;
  // Number of units awarded.
  int64 quantity = 5;
  // Nominal value for display.
  int64 value = 6;
  // Durable reward record id (used to claim).
  string reward_id = 7;
  // Assigned voucher code, if any.
  string code = 8;
}

// --- EngineService: the generic gameplay surface ---

// StartGameRequest opens a play session for a player on a game.
message StartGameRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game to start (from the path).
  string game_id = 3;
  // Player starting the session.
  string player_id = 4;
}
message StartGameResponse {
  // Opaque session id to pass to Play.
  string session_id = 1;
  // Raw JSON seed data for the client (may be empty).
  string seed_data = 2;
  // Session expiry (unix seconds).
  int64 expires_at = 3;
}

// PlayRequest submits one play within a session.
message PlayRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game being played (from the path).
  string game_id = 3;
  // Session opened by StartGame.
  string session_id = 4;
  // Player making the play.
  string player_id = 5;
  // Shape-specific play input.
  google.protobuf.Struct payload = 6;
  // Caller-supplied key to make the play idempotent.
  string idempotency_key = 7;
}
message PlayResponse {
  // Durable id of this play.
  string play_id = 1;
  // Rewards won on this play (may be empty).
  repeated Reward rewards = 2;
  // Shape-specific result metadata.
  google.protobuf.Struct metadata = 3;
}

// CheckEligibilityRequest asks whether a player may currently play a game.
message CheckEligibilityRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game to check (from the path).
  string game_id = 3;
  // Player to check.
  string player_id = 4;
}
message CheckEligibilityResponse {
  // Whether the player may play right now.
  bool can_play = 1;
  // Plays remaining under the active caps.
  int32 remaining_plays = 2;
  // Human-readable reason when can_play is false.
  string reason = 3;
  // When the play cap next resets (unix seconds; 0 if N/A).
  int64 next_reset_at = 4;
}

// GetHistoryRequest pages a player's play history for a game.
message GetHistoryRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game to read history for (from the path).
  string game_id = 3;
  // Player whose history to read.
  string player_id = 4;
  // Max entries to return.
  int32 limit = 5;
  // Opaque pagination cursor from a previous response.
  string cursor = 6;
}
// HistoryEntry is one past play.
message HistoryEntry {
  // Play id.
  string play_id = 1;
  // Game the play was on.
  string game_id = 2;
  // Raw JSON rewards won.
  string rewards = 3;
  // Raw JSON play metadata.
  string metadata = 4;
  // Play time (unix seconds).
  int64 created_at = 5;
}
message GetHistoryResponse {
  // Page of history entries (newest first).
  repeated HistoryEntry entries = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

service EngineService {
  rpc StartGame(StartGameRequest) returns (StartGameResponse) {
    option (google.api.http) = {post: "/api/v1/games/{game_id}/start" body: "*"};
  }
  rpc Play(PlayRequest) returns (PlayResponse) {
    option (google.api.http) = {post: "/api/v1/games/{game_id}/play" body: "*"};
  }
  rpc CheckEligibility(CheckEligibilityRequest) returns (CheckEligibilityResponse) {
    option (google.api.http) = {get: "/api/v1/games/{game_id}/eligibility"};
  }
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse) {
    option (google.api.http) = {get: "/api/v1/games/{game_id}/history"};
  }
}

// --- GameConfigService: minimal game-config CRUD to seed the slice ---

// CreateGameRequest creates a game under the caller's tenant/merchant.
message CreateGameRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game definition to create.
  Game game = 3;
}
message CreateGameResponse {
  // The created game.
  Game game = 1;
}

// UpdateGameRequest replaces a game's mutable fields (the embedded game's id
// identifies the target). Used by admins to change config — including the `ui`
// render block — after creation.
message UpdateGameRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game with id set; mutable fields are applied.
  Game game = 3;
}
message UpdateGameResponse {
  // The updated game.
  Game game = 1;
}

// GetGameRequest fetches a single game by id.
message GetGameRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game to fetch (from the path).
  string game_id = 3;
}
message GetGameResponse {
  // The requested game.
  Game game = 1;
}

service GameConfigService {
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse) {
    option (google.api.http) = {post: "/api/v1/games" body: "*"};
  }
  rpc GetGame(GetGameRequest) returns (GetGameResponse) {
    option (google.api.http) = {get: "/api/v1/games/{game_id}"};
  }
  rpc UpdateGame(UpdateGameRequest) returns (UpdateGameResponse) {
    option (google.api.http) = {put: "/api/v1/games/{game.id}" body: "*"};
  }
}

// --- RewardService: minimal prize creation to seed the slice ---

// CreatePrizeRequest creates a prize and associates it with a game.
message CreatePrizeRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Prize definition to create.
  Prize prize = 3;
  // Game to associate the prize with (for stock listing).
  string game_id = 4;
}
message CreatePrizeResponse {
  // The created prize.
  Prize prize = 1;
}

// ListPrizesRequest lists prizes for a game.
message ListPrizesRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game whose prizes to list.
  string game_id = 3;
}
message ListPrizesResponse {
  // Prizes associated with the game.
  repeated Prize prizes = 1;
}

// GetPrizeRequest fetches a single prize by id.
message GetPrizeRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Prize to fetch (from the path).
  string prize_id = 3;
}
message GetPrizeResponse {
  // The requested prize.
  Prize prize = 1;
}

// UpdatePrizeRequest updates a prize in place.
message UpdatePrizeRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Prize with updated fields (id identifies the target).
  Prize prize = 3;
}
message UpdatePrizeResponse {
  // The updated prize.
  Prize prize = 1;
}

// DeletePrizeRequest deletes a prize by id.
message DeletePrizeRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Prize to delete (from the path).
  string prize_id = 3;
}
message DeletePrizeResponse {}

// ImportCodesRequest bulk-loads redemption codes into a prize's pool.
message ImportCodesRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Prize to load codes into (from the path).
  string prize_id = 3;
  // Codes to import.
  repeated string codes = 4;
}
message ImportCodesResponse {
  // Number of codes imported.
  int32 imported = 1;
}

// PrizeSummaryItem is per-prize stock/award counts for a game.
message PrizeSummaryItem {
  // Prize id.
  string prize_id = 1;
  // Prize name.
  string name = 2;
  // Total stock minted.
  int64 total = 3;
  // Stock still available.
  int64 remaining = 4;
  // Units already awarded.
  int64 awarded = 5;
  // Redemption codes still available in the pool.
  int64 codes_available = 6;
}
// GetPrizeSummaryRequest returns prize stock/award counts for a game.
message GetPrizeSummaryRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game whose prize summary to compute.
  string game_id = 3;
}
message GetPrizeSummaryResponse {
  // Per-prize summary items.
  repeated PrizeSummaryItem items = 1;
}

// ClaimRewardRequest marks a won reward as claimed by the player.
message ClaimRewardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Reward to claim (from the path).
  string reward_id = 3;
  // Player claiming the reward.
  string player_id = 4;
}
message ClaimRewardResponse {
  // The updated reward record.
  RewardRecord reward = 1;
}
// FulfillRewardRequest marks a claimed reward as fulfilled (delivered).
message FulfillRewardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Reward to fulfill (from the path).
  string reward_id = 3;
}
message FulfillRewardResponse {
  // The updated reward record.
  RewardRecord reward = 1;
}
// RevokeRewardRequest revokes a reward, returning its stock.
message RevokeRewardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Reward to revoke (from the path).
  string reward_id = 3;
}
message RevokeRewardResponse {
  // The updated reward record.
  RewardRecord reward = 1;
}

// ListRewardsRequest pages a player's reward records.
message ListRewardsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Player whose rewards to list.
  string player_id = 3;
  // Max records to return.
  int32 limit = 4;
  // Opaque pagination cursor from a previous response.
  string cursor = 5;
}
message ListRewardsResponse {
  // Page of reward records (newest first).
  repeated RewardRecord rewards = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

service RewardService {
  rpc CreatePrize(CreatePrizeRequest) returns (CreatePrizeResponse) {
    option (google.api.http) = {post: "/api/v1/prizes" body: "*"};
  }
  rpc ListPrizes(ListPrizesRequest) returns (ListPrizesResponse) {
    option (google.api.http) = {get: "/api/v1/prizes"};
  }
  rpc GetPrize(GetPrizeRequest) returns (GetPrizeResponse) {
    option (google.api.http) = {get: "/api/v1/prizes/{prize_id}"};
  }
  rpc UpdatePrize(UpdatePrizeRequest) returns (UpdatePrizeResponse) {
    option (google.api.http) = {put: "/api/v1/prizes/{prize.id}" body: "*"};
  }
  rpc DeletePrize(DeletePrizeRequest) returns (DeletePrizeResponse) {
    option (google.api.http) = {delete: "/api/v1/prizes/{prize_id}"};
  }
  rpc ImportCodes(ImportCodesRequest) returns (ImportCodesResponse) {
    option (google.api.http) = {post: "/api/v1/prizes/{prize_id}/codes" body: "*"};
  }
  rpc GetPrizeSummary(GetPrizeSummaryRequest) returns (GetPrizeSummaryResponse) {
    option (google.api.http) = {get: "/api/v1/prizes/summary"};
  }

  rpc ClaimReward(ClaimRewardRequest) returns (ClaimRewardResponse) {
    option (google.api.http) = {post: "/api/v1/rewards/{reward_id}/claim" body: "*"};
  }
  rpc FulfillReward(FulfillRewardRequest) returns (FulfillRewardResponse) {
    option (google.api.http) = {post: "/api/v1/rewards/{reward_id}/fulfill" body: "*"};
  }
  rpc RevokeReward(RevokeRewardRequest) returns (RevokeRewardResponse) {
    option (google.api.http) = {post: "/api/v1/rewards/{reward_id}/revoke" body: "*"};
  }
  rpc ListRewards(ListRewardsRequest) returns (ListRewardsResponse) {
    option (google.api.http) = {get: "/api/v1/rewards"};
  }
}

// --- FulfillmentService: the delivery outbox (admin review + machine callback) ---

// FulfillmentTask is one row of the transactional outbox: a unit of delivery
// work committed atomically with the reward it delivers.
message FulfillmentTask {
  // Stable unique identifier (globally unique).
  string id = 1;
  // Tenant isolation key.
  string tenant_id = 2;
  // Merchant isolation key within the tenant.
  string merchant_id = 3;
  // Reward this task delivers.
  string reward_id = 4;
  // Prize being delivered.
  string prize_id = 5;
  // Recipient player.
  string player_id = 6;
  // Game the reward was won in.
  string game_id = 7;
  // Campaign the reward belongs to.
  string campaign_id = 8;
  // Delivery channel (e.g. "webhook", "sms", "zns").
  string channel = 9;
  // Raw JSON channel configuration.
  string channel_config = 10;
  // Task lifecycle state.
  TaskStatus status = 11;
  // Delivery attempts made so far.
  int32 attempts = 12;
  // Max attempts before the task is dead-lettered.
  int32 max_attempts = 13;
  // Last delivery error message.
  string last_error = 14;
  // Raw JSON delivery receipt: voucher code, tracking no., ….
  string receipt = 15;
  // Earliest time to retry (unix seconds).
  int64 next_attempt_at = 16;
  // Creation time (unix seconds).
  int64 created_at = 17;
  // Last update time (unix seconds).
  int64 updated_at = 18;
}

// ListTasksRequest pages fulfillment tasks with optional filters.
message ListTasksRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Status filter (UNSPECIFIED = no filter).
  TaskStatus status = 3;
  // Campaign filter (optional).
  string campaign_id = 4;
  // Prize filter (optional).
  string prize_id = 5;
  // Max tasks to return.
  int32 limit = 6;
  // Opaque pagination cursor from a previous response.
  string cursor = 7;
}
message ListTasksResponse {
  // Page of fulfillment tasks.
  repeated FulfillmentTask tasks = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

// GetTaskRequest fetches a single fulfillment task by id.
message GetTaskRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Task to fetch (from the path).
  string task_id = 3;
}
message GetTaskResponse {
  // The requested task.
  FulfillmentTask task = 1;
}

// RetryTaskRequest re-queues a failed task for delivery.
message RetryTaskRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Task to retry (from the path).
  string task_id = 3;
}
message RetryTaskResponse {
  // The updated task.
  FulfillmentTask task = 1;
}

// ReportResult finalizes a task from an external orchestrator (n8n) callback.
// Looked up by the globally-unique task_id; tenant/merchant are advisory.
message ReportResultRequest {
  // Tenant isolation key (advisory).
  string tenant_id = 1;
  // Merchant isolation key (advisory).
  string merchant_id = 2;
  // Task to finalize (from the path).
  string task_id = 3;
  // Terminal status: FULFILLED | FAILED.
  TaskStatus status = 4;
  // Raw JSON delivery receipt.
  string receipt = 5;
  // Error detail, populated when status == FAILED.
  string error = 6;
}
message ReportResultResponse {
  // The finalized task.
  FulfillmentTask task = 1;
}

service FulfillmentService {
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (google.api.http) = {get: "/api/v1/fulfillment/tasks"};
  }
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option (google.api.http) = {get: "/api/v1/fulfillment/tasks/{task_id}"};
  }
  rpc RetryTask(RetryTaskRequest) returns (RetryTaskResponse) {
    option (google.api.http) = {post: "/api/v1/fulfillment/tasks/{task_id}/retry" body: "*"};
  }
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse) {
    option (google.api.http) = {post: "/api/v1/fulfillment/tasks/{task_id}/callback" body: "*"};
  }
}

// --- Phase 4: tenancy, identity & player ---

// Tenant is a top-level customer of the platform.
message Tenant {
  // Stable unique identifier.
  string id = 1;
  // Human-readable tenant name.
  string name = 2;
  // Subscription plan key.
  string plan = 3;
  // Raw JSON settings: {identity_linking, default_locale, wallet_scope}.
  string settings = 4;
  // Creation time (unix seconds).
  int64 created_at = 5;
  // Last update time (unix seconds).
  int64 updated_at = 6;
}

message CreateTenantRequest {
  // Tenant to create.
  Tenant tenant = 1;
}
message CreateTenantResponse {
  // The created tenant.
  Tenant tenant = 1;
}
message GetTenantRequest {
  // Tenant to fetch (from the path).
  string tenant_id = 1;
}
message GetTenantResponse {
  // The requested tenant.
  Tenant tenant = 1;
}
message UpdateTenantRequest {
  // Tenant with updated fields (id identifies the target).
  Tenant tenant = 1;
}
message UpdateTenantResponse {
  // The updated tenant.
  Tenant tenant = 1;
}
message ListTenantsRequest {
  // Max tenants to return.
  int32 limit = 1;
  // Opaque pagination cursor from a previous response.
  string cursor = 2;
}
message ListTenantsResponse {
  // Page of tenants.
  repeated Tenant tenants = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

service TenantService { // tenant CRUD (platform-scoped; no tenant/merchant isolation keys)
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {post: "/api/v1/tenants" body: "*"};
  }
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = {get: "/api/v1/tenants/{tenant_id}"};
  }
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {put: "/api/v1/tenants/{tenant.id}" body: "*"};
  }
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {get: "/api/v1/tenants"};
  }
}

// Merchant is a brand/store under a tenant.
message Merchant {
  // Stable unique identifier.
  string id = 1;
  // Owning tenant.
  string tenant_id = 2;
  // Human-readable merchant name.
  string name = 3;
  // Logo image URL.
  string logo = 4;
  // Raw JSON settings: {wallet_scope_override}.
  string settings = 5;
  // Creation time (unix seconds).
  int64 created_at = 6;
  // Last update time (unix seconds).
  int64 updated_at = 7;
}

message CreateMerchantRequest {
  // Owning tenant (from the path).
  string tenant_id = 1;
  // Merchant to create.
  Merchant merchant = 2;
}
message CreateMerchantResponse {
  // The created merchant.
  Merchant merchant = 1;
}
message GetMerchantRequest {
  // Owning tenant (from the path).
  string tenant_id = 1;
  // Merchant to fetch (from the path).
  string merchant_id = 2;
}
message GetMerchantResponse {
  // The requested merchant.
  Merchant merchant = 1;
}
message UpdateMerchantRequest {
  // Merchant with updated fields (id identifies the target).
  Merchant merchant = 1;
}
message UpdateMerchantResponse {
  // The updated merchant.
  Merchant merchant = 1;
}
message ListMerchantsRequest {
  // Owning tenant (from the path).
  string tenant_id = 1;
  // Max merchants to return.
  int32 limit = 2;
  // Opaque pagination cursor from a previous response.
  string cursor = 3;
}
message ListMerchantsResponse {
  // Page of merchants.
  repeated Merchant merchants = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

service MerchantService { // merchant CRUD under a tenant
  rpc CreateMerchant(CreateMerchantRequest) returns (CreateMerchantResponse) {
    option (google.api.http) = {post: "/api/v1/tenants/{tenant_id}/merchants" body: "*"};
  }
  rpc GetMerchant(GetMerchantRequest) returns (GetMerchantResponse) {
    option (google.api.http) = {get: "/api/v1/tenants/{tenant_id}/merchants/{merchant_id}"};
  }
  rpc UpdateMerchant(UpdateMerchantRequest) returns (UpdateMerchantResponse) {
    option (google.api.http) = {put: "/api/v1/merchants/{merchant.id}" body: "*"};
  }
  rpc ListMerchants(ListMerchantsRequest) returns (ListMerchantsResponse) {
    option (google.api.http) = {get: "/api/v1/tenants/{tenant_id}/merchants"};
  }
}

// Contact is a verified means of identifying a person (globally unique).
message Contact {
  // Contact kind (phone/email).
  ContactType type = 1;
  // Normalized contact value.
  string value = 2;
  // Whether the contact has been verified.
  bool verified = 3;
}

// Identity is a global person, independent of any tenant.
message Identity {
  // Stable unique identifier.
  string id = 1;
  // Verified contacts linked to this person.
  repeated Contact contacts = 2;
  // Creation time (unix seconds).
  int64 created_at = 3;
  // Last update time (unix seconds).
  int64 updated_at = 4;
}

// ResolveOrCreate takes a VERIFIED contact and returns the identity (created if
// new). The hosting auth layer calls this after a provider verifies the contact.
message ResolveOrCreateRequest {
  // Verified contact to resolve.
  Contact contact = 1;
}
message ResolveOrCreateResponse {
  // The resolved or newly created identity.
  Identity identity = 1;
  // Whether the identity was newly created.
  bool created = 2;
}
message LinkContactRequest {
  // Identity to link the contact to (from the path).
  string identity_id = 1;
  // Verified contact to link.
  Contact contact = 2;
}
message LinkContactResponse {
  // The updated identity.
  Identity identity = 1;
}
message GetIdentityRequest {
  // Identity to fetch (from the path).
  string identity_id = 1;
}
message GetIdentityResponse {
  // The requested identity.
  Identity identity = 1;
}

service IdentityService { // global person (internal)
  rpc ResolveOrCreate(ResolveOrCreateRequest) returns (ResolveOrCreateResponse) {
    option (google.api.http) = {post: "/api/v1/identities/resolve" body: "*"};
  }
  rpc LinkContact(LinkContactRequest) returns (LinkContactResponse) {
    option (google.api.http) = {post: "/api/v1/identities/{identity_id}/contacts" body: "*"};
  }
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse) {
    option (google.api.http) = {get: "/api/v1/identities/{identity_id}"};
  }
}

// Player is a tenant-scoped projection of a global identity.
message Player {
  // Stable unique identifier.
  string id = 1;
  // Owning tenant.
  string tenant_id = 2;
  // Owning merchant within the tenant.
  string merchant_id = 3;
  // Backing global identity.
  string identity_id = 4;
  // Raw JSON profile (collected fields).
  string profile = 5;
  // Creation time (unix seconds).
  int64 created_at = 6;
  // Last update time (unix seconds).
  int64 updated_at = 7;
}

// ResolvePlayer is the business operation behind login: given a VERIFIED contact
// (the caller — a BFF — has already authenticated it), resolve-or-create the
// global identity and upsert the tenant-scoped player. Authentication itself
// (challenge issue/verify, token minting) is NOT Core's concern; it lives in the
// BFF, which calls this after a successful verification.
message ResolvePlayerRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant (optional).
  string merchant_id = 2;
  // Verified contact kind.
  ContactType contact_type = 3;
  // Raw contact value; normalized server-side.
  string contact_value = 4;
}
message ResolvePlayerResponse {
  // The resolved or created player.
  Player player = 1;
  // The backing global identity.
  Identity identity = 2;
  // Whether the identity was newly created.
  bool identity_is_new = 3;
  // Whether the player was newly created.
  bool player_is_new = 4;
}

// GetProfileRequest fetches a player and its identity.
message GetProfileRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Player to fetch (from the path).
  string player_id = 3;
}
message GetProfileResponse {
  // The requested player.
  Player player = 1;
  // The backing global identity.
  Identity identity = 2;
}
// UpdateProfileRequest replaces a player's collected profile fields.
message UpdateProfileRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Player to update (from the path).
  string player_id = 3;
  // Raw JSON profile to store.
  string profile = 4;
}
message UpdateProfileResponse {
  // The updated player.
  Player player = 1;
}
// AddContactRequest attaches a newly verified contact to a player's identity.
message AddContactRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Player adding the contact (from the path).
  string player_id = 3;
  // Identity to link the contact to.
  string identity_id = 4;
  // Contact kind.
  ContactType contact_type = 5;
  // Raw contact value; normalized server-side.
  string contact_value = 6;
  // Verification method used (dev stubs auto-verify).
  AuthMethod method = 7;
}
message AddContactResponse {
  // The updated identity.
  Identity identity = 1;
}

// GetTurnBalanceRequest reads a player's quest-granted turn balance.
message GetTurnBalanceRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Player whose balance to read (from the path).
  string player_id = 3;
  // Turn-balance scope key (e.g. campaign id).
  string scope_key = 4;
}
message GetTurnBalanceResponse {
  // Current turn balance.
  int64 balance = 1;
  // Scope key the balance is keyed by.
  string scope_key = 2;
}
// GrantTurnsRequest adds (or removes) turns from a player's balance.
message GrantTurnsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Player to grant turns to (from the path).
  string player_id = 3;
  // Turn-balance scope key (e.g. campaign id).
  string scope_key = 4;
  // Signed amount to add (negative to deduct).
  int64 delta = 5;
}
message GrantTurnsResponse {
  // Resulting turn balance.
  int64 balance = 1;
}
// ConsumeTurnRequest spends one turn from a player's balance.
message ConsumeTurnRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Player consuming a turn (from the path).
  string player_id = 3;
  // Turn-balance scope key (e.g. campaign id).
  string scope_key = 4;
}
message ConsumeTurnResponse {
  // Whether a turn was successfully consumed.
  bool ok = 1;
  // Resulting turn balance.
  int64 balance = 2;
}

service PlayerService {
  rpc ResolvePlayer(ResolvePlayerRequest) returns (ResolvePlayerResponse) {
    option (google.api.http) = {post: "/api/v1/players/resolve" body: "*"};
  }
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (google.api.http) = {get: "/api/v1/players/{player_id}"};
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {put: "/api/v1/players/{player_id}/profile" body: "*"};
  }
  rpc AddContact(AddContactRequest) returns (AddContactResponse) {
    option (google.api.http) = {post: "/api/v1/players/{player_id}/contacts" body: "*"};
  }
  rpc GetTurnBalance(GetTurnBalanceRequest) returns (GetTurnBalanceResponse) {
    option (google.api.http) = {get: "/api/v1/players/{player_id}/turns"};
  }
  rpc GrantTurns(GrantTurnsRequest) returns (GrantTurnsResponse) {
    option (google.api.http) = {post: "/api/v1/players/{player_id}/turns/grant" body: "*"};
  }
  rpc ConsumeTurn(ConsumeTurnRequest) returns (ConsumeTurnResponse) {
    option (google.api.http) = {post: "/api/v1/players/{player_id}/turns/consume" body: "*"};
  }
}

// --- Phase 5: campaign aggregate (under a merchant) ---

// Campaign groups games + quests under a merchant, with channels, auth methods,
// a run window, and widget/eligibility settings. tenant_id + merchant_id are the
// isolation boundary (from the request, never the path).
message Campaign {
  // Stable unique identifier.
  string id = 1;
  // Owning tenant.
  string tenant_id = 2;
  // Owning merchant within the tenant.
  string merchant_id = 3;
  // Human-readable campaign name.
  string name = 4;
  // Lifecycle state.
  CampaignStatus status = 5;
  // Run window start (unix seconds).
  int64 start_date = 6;
  // Run window end (unix seconds).
  int64 end_date = 7;
  // Enabled presentation channels.
  repeated string channels = 8;
  // Linked game ids.
  repeated string games = 9;
  // Linked quest ids.
  repeated string quests = 10;
  // Raw JSON settings: {require_auth, auth_methods, collect_fields,
  // max_plays_per_user, max_plays_per_day, wallet_scope}.
  string settings = 11;
  // Creation time (unix seconds).
  int64 created_at = 12;
  // Last update time (unix seconds).
  int64 updated_at = 13;
}

// CreateCampaignRequest creates a campaign under the caller's tenant/merchant.
message CreateCampaignRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign to create.
  Campaign campaign = 3;
}
message CreateCampaignResponse {
  // The created campaign.
  Campaign campaign = 1;
}
// GetCampaignRequest fetches a single campaign by id.
message GetCampaignRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign to fetch (from the path).
  string campaign_id = 3;
}
message GetCampaignResponse {
  // The requested campaign.
  Campaign campaign = 1;
}
// UpdateCampaignRequest updates a campaign in place.
message UpdateCampaignRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign with updated fields (id identifies the target).
  Campaign campaign = 3;
}
message UpdateCampaignResponse {
  // The updated campaign.
  Campaign campaign = 1;
}
// ListCampaignsRequest pages campaigns under the caller's tenant/merchant.
message ListCampaignsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Max campaigns to return.
  int32 limit = 3;
  // Opaque pagination cursor from a previous response.
  string cursor = 4;
}
message ListCampaignsResponse {
  // Page of campaigns.
  repeated Campaign campaigns = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}
// DuplicateCampaignRequest deep-copies a campaign under a new name.
message DuplicateCampaignRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign to duplicate (from the path).
  string campaign_id = 3;
  // Name for the new copy.
  string name = 4;
}
message DuplicateCampaignResponse {
  // The newly created campaign copy.
  Campaign campaign = 1;
}

// CampaignAnalytics is rolled-up performance for a campaign.
message CampaignAnalytics {
  // Campaign the metrics belong to.
  string campaign_id = 1;
  // Total plays across the campaign.
  int64 total_plays = 2;
  // Total winning plays.
  int64 total_wins = 3;
  // Distinct players who played.
  int64 unique_players = 4;
  // Wins / plays.
  double conversion = 5;
}
// GetCampaignAnalyticsRequest returns rolled-up metrics for a campaign.
message GetCampaignAnalyticsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign to analyze (from the path).
  string campaign_id = 3;
}
message GetCampaignAnalyticsResponse {
  // The campaign analytics.
  CampaignAnalytics analytics = 1;
}

// GetPublicConfig resolves a campaign by id alone (no isolation keys) for the FE widget.
message GetPublicConfigRequest {
  // Campaign to resolve (from the path).
  string campaign_id = 1;
}
message GetPublicConfigResponse {
  // The public campaign config.
  Campaign campaign = 1;
}

service CampaignService { // campaign aggregate: CRUD + analytics + unscoped config read
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse) {
    option (google.api.http) = {post: "/api/v1/campaigns" body: "*"};
  }
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse) {
    option (google.api.http) = {get: "/api/v1/campaigns/{campaign_id}"};
  }
  rpc UpdateCampaign(UpdateCampaignRequest) returns (UpdateCampaignResponse) {
    option (google.api.http) = {put: "/api/v1/campaigns/{campaign.id}" body: "*"};
  }
  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse) {
    option (google.api.http) = {get: "/api/v1/campaigns"};
  }
  rpc DuplicateCampaign(DuplicateCampaignRequest) returns (DuplicateCampaignResponse) {
    option (google.api.http) = {post: "/api/v1/campaigns/{campaign_id}/duplicate" body: "*"};
  }
  rpc GetCampaignAnalytics(GetCampaignAnalyticsRequest) returns (GetCampaignAnalyticsResponse) {
    option (google.api.http) = {get: "/api/v1/campaigns/{campaign_id}/analytics"};
  }
  rpc GetPublicConfig(GetPublicConfigRequest) returns (GetPublicConfigResponse) {
    option (google.api.http) = {get: "/api/v1/campaigns/{campaign_id}/config"};
  }
}

// --- Phase 6: quest / mission ---

// QuestReward is what a quest grants on completion.
message QuestReward {
  // Reward kind.
  QuestRewardType type = 1;
  // Turns granted on completion.
  int64 quantity = 2;
}

// Quest is an admin-configured mission under a campaign. config is verifier-
// specific raw JSON (decoded only by the matching quest-type verifier).
message Quest {
  // Stable unique identifier.
  string id = 1;
  // Owning tenant.
  string tenant_id = 2;
  // Owning merchant within the tenant.
  string merchant_id = 3;
  // Campaign this quest belongs to.
  string campaign_id = 4;
  // Quest type selecting the verifier.
  QuestType type = 5;
  // Human-readable quest name.
  string name = 6;
  // Whether the quest is live.
  QuestStatus status = 7;
  // Reward granted on completion.
  QuestReward reward = 8;
  // Raw JSON, verifier-specific config.
  string config = 9;
  // Creation time (unix seconds).
  int64 created_at = 10;
  // Last update time (unix seconds).
  int64 updated_at = 11;
}

// CreateQuestRequest creates a quest under the caller's tenant/merchant.
message CreateQuestRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Quest to create.
  Quest quest = 3;
}
message CreateQuestResponse {
  // The created quest.
  Quest quest = 1;
}
// GetQuestRequest fetches a single quest by id.
message GetQuestRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Quest to fetch (from the path).
  string quest_id = 3;
}
message GetQuestResponse {
  // The requested quest.
  Quest quest = 1;
}
// UpdateQuestRequest updates a quest in place.
message UpdateQuestRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Quest with updated fields (id identifies the target).
  Quest quest = 3;
}
message UpdateQuestResponse {
  // The updated quest.
  Quest quest = 1;
}
// DeleteQuestRequest deletes a quest by id.
message DeleteQuestRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Quest to delete (from the path).
  string quest_id = 3;
}
message DeleteQuestResponse {}
// ListQuestsRequest pages quests, optionally filtered by campaign.
message ListQuestsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign filter (optional).
  string campaign_id = 3;
  // Max quests to return.
  int32 limit = 4;
  // Opaque pagination cursor from a previous response.
  string cursor = 5;
}
message ListQuestsResponse {
  // Page of quests.
  repeated Quest quests = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

// QuestState is a quest plus the caller's completion status (player list).
message QuestState {
  // The quest definition.
  Quest quest = 1;
  // Whether ever completed (for daily quests: today).
  bool completed = 2;
  reserved "can_complete"; // removed: UI affordance — derive from status + completed
  // Lifetime completion count.
  int32 completions = 4;
  // Last completion time (unix seconds).
  int64 last_completed = 5;
}
// ListPlayerQuestsRequest lists a campaign's quests with a player's progress.
message ListPlayerQuestsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign whose quests to list (from the path).
  string campaign_id = 3;
  // Player whose progress to include.
  string player_id = 4;
}
message ListPlayerQuestsResponse {
  // Quests with the player's completion status.
  repeated QuestState quests = 1;
}

// CompleteQuest verifies the proof, gates re-completion, and grants the reward.
message CompleteQuestRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Quest to complete (from the path).
  string quest_id = 3;
  // Player completing the quest.
  string player_id = 4;
  // Raw JSON proof, verifier-specific.
  string proof = 5;
}
message CompleteQuestResponse {
  // Whether the quest was completed this call.
  bool completed = 1;
  // Turns granted on completion.
  int64 turns_granted = 2;
  // Resulting turn balance.
  int64 turn_balance = 3;
}

service QuestService { // quest CRUD + player list/complete
  rpc CreateQuest(CreateQuestRequest) returns (CreateQuestResponse) {
    option (google.api.http) = {post: "/api/v1/quests" body: "*"};
  }
  rpc GetQuest(GetQuestRequest) returns (GetQuestResponse) {
    option (google.api.http) = {get: "/api/v1/quests/{quest_id}"};
  }
  rpc UpdateQuest(UpdateQuestRequest) returns (UpdateQuestResponse) {
    option (google.api.http) = {put: "/api/v1/quests/{quest.id}" body: "*"};
  }
  rpc DeleteQuest(DeleteQuestRequest) returns (DeleteQuestResponse) {
    option (google.api.http) = {delete: "/api/v1/quests/{quest_id}"};
  }
  rpc ListQuests(ListQuestsRequest) returns (ListQuestsResponse) {
    option (google.api.http) = {get: "/api/v1/quests"};
  }
  rpc ListPlayerQuests(ListPlayerQuestsRequest) returns (ListPlayerQuestsResponse) {
    option (google.api.http) = {get: "/api/v1/campaigns/{campaign_id}/quests"};
  }
  rpc CompleteQuest(CompleteQuestRequest) returns (CompleteQuestResponse) {
    option (google.api.http) = {post: "/api/v1/quests/{quest_id}/complete" body: "*"};
  }
}

// --- Phase 7: leaderboard ---

// Leaderboard config. time_window/prize_tiers/anti_cheat are raw JSON (decoded
// by the hosting layer): time_window={type,period,start,end},
// prize_tiers=[{from_rank,to_rank,prize_id}], anti_cheat={score_ceiling,flag_outliers}.
message Leaderboard {
  // Stable unique identifier.
  string id = 1;
  // Owning tenant.
  string tenant_id = 2;
  // Owning merchant within the tenant.
  string merchant_id = 3;
  // Campaign this leaderboard belongs to.
  string campaign_id = 4;
  // Human-readable leaderboard name.
  string name = 5;
  // Score the leaderboard ranks by.
  LeaderboardMetric metric = 6;
  // Raw JSON time window: {type, period, start, end}.
  string time_window = 7;
  // Raw JSON prize tiers: [{from_rank, to_rank, prize_id}].
  string prize_tiers = 8;
  // Raw JSON anti-cheat config: {score_ceiling, flag_outliers}.
  string anti_cheat = 9;
  // Lifecycle state.
  LeaderboardStatus status = 10;
  // Creation time (unix seconds).
  int64 created_at = 11;
  // Last update time (unix seconds).
  int64 updated_at = 12;
}

// RankedEntry is one player's standing (player list / rankings).
message RankedEntry {
  // Player the entry belongs to.
  string player_id = 1;
  // Ranking score.
  int64 score = 2;
  // Plays contributing to the score.
  int64 plays = 3;
  // 1-based rank.
  int64 rank = 4;
  // Entry standing (active/flagged/disqualified).
  EntryState state = 5;
}

// CreateLeaderboardRequest creates a leaderboard under the caller's tenant/merchant.
message CreateLeaderboardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard to create.
  Leaderboard leaderboard = 3;
}
message CreateLeaderboardResponse {
  // The created leaderboard.
  Leaderboard leaderboard = 1;
}
// GetLeaderboardRequest fetches a single leaderboard by id.
message GetLeaderboardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard to fetch (from the path).
  string leaderboard_id = 3;
}
message GetLeaderboardResponse {
  // The requested leaderboard.
  Leaderboard leaderboard = 1;
}
// UpdateLeaderboardRequest updates a leaderboard in place.
message UpdateLeaderboardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard with updated fields (id identifies the target).
  Leaderboard leaderboard = 3;
}
message UpdateLeaderboardResponse {
  // The updated leaderboard.
  Leaderboard leaderboard = 1;
}
// ListLeaderboardsRequest pages leaderboards, optionally filtered by campaign.
message ListLeaderboardsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign filter (optional).
  string campaign_id = 3;
  // Max leaderboards to return.
  int32 limit = 4;
  // Opaque pagination cursor from a previous response.
  string cursor = 5;
}
message ListLeaderboardsResponse {
  // Page of leaderboards.
  repeated Leaderboard leaderboards = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

// FinalizeLeaderboardRequest closes a leaderboard and awards its prize tiers.
message FinalizeLeaderboardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard to finalize (from the path).
  string leaderboard_id = 3;
}
// TierAward records a prize awarded to a rank on finalization.
message TierAward {
  // Awarded rank.
  int32 rank = 1;
  // Player at that rank.
  string player_id = 2;
  // Prize awarded.
  string prize_id = 3;
  // Resulting durable reward record id.
  string reward_id = 4;
}
message FinalizeLeaderboardResponse {
  // Number of tier prizes awarded.
  int32 awarded = 1;
  // The individual tier awards.
  repeated TierAward awards = 2;
}

// ResetLeaderboardRequest clears all entries from a leaderboard.
message ResetLeaderboardRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard to reset (from the path).
  string leaderboard_id = 3;
}
message ResetLeaderboardResponse {
  // Number of entries cleared.
  int64 cleared = 1;
}

// DisqualifyEntryRequest disqualifies a player's entry.
message DisqualifyEntryRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard the entry is on (from the path).
  string leaderboard_id = 3;
  // Player to disqualify.
  string player_id = 4;
}
message DisqualifyEntryResponse {
  // The updated entry.
  RankedEntry entry = 1;
}
// AdjustEntryRequest applies a manual score delta to a player's entry.
message AdjustEntryRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard the entry is on (from the path).
  string leaderboard_id = 3;
  // Player whose entry to adjust.
  string player_id = 4;
  // Signed score delta to apply.
  int64 delta = 5;
}
message AdjustEntryResponse {
  // The updated entry.
  RankedEntry entry = 1;
}

// GetRankingsRequest pages a leaderboard's ranked entries.
message GetRankingsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Leaderboard to read (from the path).
  string leaderboard_id = 3;
  // Max entries to return.
  int32 limit = 4;
  // Offset into the ranking (for paging).
  int32 offset = 5;
}
message GetRankingsResponse {
  // Page of ranked entries.
  repeated RankedEntry entries = 1;
  // Total ranked entries.
  int64 total = 2;
  // Key identifying the active time window.
  string window_key = 3;
}

service LeaderboardService { // leaderboard CRUD + finalize/reset/disqualify/adjust + player reads
  rpc CreateLeaderboard(CreateLeaderboardRequest) returns (CreateLeaderboardResponse) {
    option (google.api.http) = {post: "/api/v1/leaderboards" body: "*"};
  }
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse) {
    option (google.api.http) = {get: "/api/v1/leaderboards/{leaderboard_id}"};
  }
  rpc UpdateLeaderboard(UpdateLeaderboardRequest) returns (UpdateLeaderboardResponse) {
    option (google.api.http) = {put: "/api/v1/leaderboards/{leaderboard.id}" body: "*"};
  }
  rpc ListLeaderboards(ListLeaderboardsRequest) returns (ListLeaderboardsResponse) {
    option (google.api.http) = {get: "/api/v1/leaderboards"};
  }
  rpc FinalizeLeaderboard(FinalizeLeaderboardRequest) returns (FinalizeLeaderboardResponse) {
    option (google.api.http) = {post: "/api/v1/leaderboards/{leaderboard_id}/finalize" body: "*"};
  }
  rpc ResetLeaderboard(ResetLeaderboardRequest) returns (ResetLeaderboardResponse) {
    option (google.api.http) = {post: "/api/v1/leaderboards/{leaderboard_id}/reset" body: "*"};
  }
  rpc DisqualifyEntry(DisqualifyEntryRequest) returns (DisqualifyEntryResponse) {
    option (google.api.http) = {post: "/api/v1/leaderboards/{leaderboard_id}/disqualify" body: "*"};
  }
  rpc AdjustEntry(AdjustEntryRequest) returns (AdjustEntryResponse) {
    option (google.api.http) = {post: "/api/v1/leaderboards/{leaderboard_id}/adjust" body: "*"};
  }
  rpc GetRankings(GetRankingsRequest) returns (GetRankingsResponse) {
    option (google.api.http) = {get: "/api/v1/leaderboards/{leaderboard_id}/rankings"};
  }
}

// --- Phase 8: wallet, points & exchange ---

// LedgerEntry is one signed movement in a player's points wallet.
message LedgerEntry {
  // Stable unique identifier.
  string id = 1;
  // Currency code the entry is in.
  string currency = 2;
  // Signed amount: + earn, - spend.
  int64 amount = 3;
  // Why the entry was written.
  LedgerReason reason = 4;
  // Reference id (play, redemption, …).
  string ref_id = 5;
  // Entry time (unix seconds).
  int64 created_at = 6;
}

// GetWalletRequest reads a player's balances within a wallet scope.
message GetWalletRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Wallet scope key (e.g. campaign id).
  string scope_key = 3;
  // Player whose wallet to read.
  string player_id = 4;
}
message GetWalletResponse {
  // Balances keyed by currency.
  map<string, int64> balances = 1;
}

// GetLedgerRequest pages a player's wallet ledger within a scope.
message GetLedgerRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Wallet scope key (e.g. campaign id).
  string scope_key = 3;
  // Player whose ledger to read.
  string player_id = 4;
  // Max entries to return.
  int32 limit = 5;
  // Opaque pagination cursor from a previous response.
  string cursor = 6;
}
message GetLedgerResponse {
  // Page of ledger entries (newest first).
  repeated LedgerEntry entries = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

// MilestoneState is a milestone plus the caller's progress toward it.
message MilestoneState {
  // Milestone id.
  string milestone_id = 1;
  // Points threshold to unlock.
  int64 threshold = 2;
  // Prize granted at the threshold.
  string prize_id = 3;
  // Progress state for the player.
  MilestoneStatus status = 4;
  // Current progress toward the threshold.
  int64 progress = 5;
  // Points remaining to the threshold.
  int64 remaining = 6;
}
// GetMilestonesRequest reads a player's milestone progress for a game.
message GetMilestonesRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game whose milestones to read (from the path).
  string game_id = 3;
  // Player whose progress to read.
  string player_id = 4;
}
message GetMilestonesResponse {
  // Currency the milestones are denominated in.
  string currency = 1;
  // How the milestone set behaves.
  MilestoneMode mode = 2;
  // Player's current balance in the currency.
  int64 balance = 3;
  // Milestones with the player's progress.
  repeated MilestoneState milestones = 4;
}

// RedeemRequest spends points to claim a milestone reward.
message RedeemRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Game the milestone belongs to (from the path).
  string game_id = 3;
  // Milestone to redeem.
  string milestone_id = 4;
  // Player redeeming.
  string player_id = 5;
}
message RedeemResponse {
  // Whether the redemption succeeded.
  bool redeemed = 1;
  // Milestone mode that governed the redemption.
  MilestoneMode mode = 2;
  // Amounts spent, keyed by currency.
  map<string, int64> spent = 3;
  // Reward granted, if any.
  Reward reward = 4;
  // Resulting balances, keyed by currency.
  map<string, int64> balances = 5;
}

service WalletService { // player surface (wallet/ledger/milestones/redeem)
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse) {
    option (google.api.http) = {get: "/api/v1/wallet"};
  }
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse) {
    option (google.api.http) = {get: "/api/v1/wallet/ledger"};
  }
  rpc GetMilestones(GetMilestonesRequest) returns (GetMilestonesResponse) {
    option (google.api.http) = {get: "/api/v1/games/{game_id}/milestones"};
  }
  rpc Redeem(RedeemRequest) returns (RedeemResponse) {
    option (google.api.http) = {post: "/api/v1/games/{game_id}/redeem" body: "*"};
  }
}

// --- Integration hub (Phase 10): outbound adapters fired on domain events ---

// Integration is an outbound adapter fired on subscribed domain events.
message Integration {
  // Stable unique identifier.
  string id = 1;
  // Tenant isolation key.
  string tenant_id = 2;
  // Merchant isolation key within the tenant.
  string merchant_id = 3;
  // Outbound adapter kind.
  IntegrationType type = 4;
  // Campaign filter ("" = all campaigns in scope).
  string campaign_id = 5;
  // Subscribed event types (play_completed, prize_won, …).
  repeated string events = 6;
  // Raw JSON adapter config: {url, hmac_secret, sheet_id, …}.
  string config = 7;
  // Whether the integration is firing.
  IntegrationStatus status = 8;
  // Creation time (unix seconds).
  int64 created_at = 9;
}

// CreateIntegrationRequest registers an outbound integration.
message CreateIntegrationRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Integration to create.
  Integration integration = 3;
}
message CreateIntegrationResponse {
  // The created integration.
  Integration integration = 1;
}

// ListIntegrationsRequest pages integrations, optionally filtered by campaign.
message ListIntegrationsRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Campaign filter (optional).
  string campaign_id = 3;
  // Max integrations to return.
  int32 limit = 4;
  // Opaque pagination cursor from a previous response.
  string cursor = 5;
}
message ListIntegrationsResponse {
  // Page of integrations.
  repeated Integration integrations = 1;
  // Cursor for the next page ("" when exhausted).
  string next_cursor = 2;
}

// DeleteIntegrationRequest deletes an integration by id.
message DeleteIntegrationRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Integration to delete (from the path).
  string id = 3;
}
message DeleteIntegrationResponse {}

// EmitEventRequest manually injects a domain event into the integration hub.
message EmitEventRequest {
  // Tenant isolation key (required).
  string tenant_id = 1;
  // Merchant isolation key within the tenant.
  string merchant_id = 2;
  // Event type to emit.
  string type = 3;
  // Raw JSON event payload object.
  string payload = 4;
}
message EmitEventResponse {
  // Number of integrations the event was delivered to.
  int32 dispatched = 1;
}

service IntegrationService { // integration CRUD + manual EmitEvent injection
  rpc CreateIntegration(CreateIntegrationRequest) returns (CreateIntegrationResponse) {
    option (google.api.http) = {post: "/api/v1/integrations" body: "*"};
  }
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse) {
    option (google.api.http) = {get: "/api/v1/integrations"};
  }
  rpc DeleteIntegration(DeleteIntegrationRequest) returns (DeleteIntegrationResponse) {
    option (google.api.http) = {delete: "/api/v1/integrations/{id}"};
  }
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse) {
    option (google.api.http) = {post: "/api/v1/integrations/emit" body: "*"};
  }
}
