name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build & test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gamekit/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l adapters bffkit core examples gamekit pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: Build (both modules)
        run: make build

      - name: Vet (both modules)
        run: make vet

      - name: Test (both modules)
        run: make test

      - name: Race test (gamekit stock-race coverage)
        run: make test-race

  integration:
    name: Adapter integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gamekit/go.sum
      # ubuntu-latest ships a working Docker daemon, which testcontainers drives
      # to spin up real Postgres + MySQL + Redis for the port-contract suite.
      - name: Integration tests
        run: make test-integration

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci
      - run: npm run build
